# Copy this file to %USERPROFILE%\.cloudflared\config.yml
# after: cloudflared tunnel login
#         cloudflared tunnel create aelinkgenerator
#
# Replace YOUR_TUNNEL_ID and YOUR_WINDOWS_USERNAME.

tunnel: YOUR_TUNNEL_ID
credentials-file: C:\Users\YOUR_WINDOWS_USERNAME\.cloudflared\YOUR_TUNNEL_ID.json

ingress:
  - hostname: helpmegetaround.com
    service: http://127.0.0.1:3000
  - hostname: www.helpmegetaround.com
    service: http://127.0.0.1:3000
  - service: http_status:404
