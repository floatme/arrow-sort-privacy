<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AliExpress Affiliate Link</title>
  <meta name="description" content="Paste an AliExpress product link and get a shareable affiliate tracking link." />
  <style>
    :root {
      --ink: #1b1510;
      --paper: #f3ece2;
      --card: #fffaf3;
      --line: #e3d5c5;
      --muted: #6d6156;
      --accent: #c13b24;
      --accent-hover: #a8301d;
      --ok: #246b48;
      --ok-bg: #e8f4ec;
      --warn: #8a3b12;
      --warn-bg: #fbeee6;
      --shadow: 0 18px 40px rgba(60, 36, 18, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #fbe3c8 0%, transparent 55%),
        radial-gradient(900px 400px at 110% 0%, #f3cfc0 0%, transparent 50%),
        var(--paper);
      font-family: system-ui, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .wrap { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin: 0 0 12px;
    }
    .lede { color: var(--muted); font-size: 1.08rem; margin: 0 0 28px; max-width: 40rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      resize: vertical;
    }
    textarea:focus { outline: 3px solid rgba(193, 59, 36, 0.25); border-color: var(--accent); }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button {
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 12px 18px;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-hover); }
    .primary:disabled { background: #c9b8aa; cursor: not-allowed; }
    .ghost { background: #fff; border: 1px solid var(--line); }
    .hint { color: var(--muted); font-size: 0.92rem; margin: 10px 0 0; }
    .status { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
    .status.ok { display: block; background: var(--ok-bg); color: var(--ok); }
    .status.error { display: block; background: var(--warn-bg); color: var(--warn); }
    .result { display: none; }
    .result.visible { display: block; }
    .result-link {
      word-break: break-all;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 8px 0 10px;
    }
    .meta { color: var(--muted); margin: 0 0 8px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Paste an AliExpress link. Get a tracking link back.</h1>
      <p class="lede">Anyone can use this page. Paste a product URL and we return a shareable affiliate link.</p>
    </header>
    <section class="card">
      <label for="sourceUrl">AliExpress product link</label>
      <textarea id="sourceUrl" placeholder="https://www.aliexpress.com/item/1005001234567890.html"></textarea>
      <div class="actions">
        <button class="primary" id="convertBtn" type="button">Get affiliate link</button>
        <button class="ghost" id="clearBtn" type="button">Clear</button>
      </div>
      <p class="hint">Works with product pages, mobile links, and regional AliExpress domains.</p>
      <div id="status" class="status" role="status"></div>
    </section>
    <section class="card result" id="resultCard">
      <p class="meta" id="resultMeta"></p>
      <div class="result-link" id="resultLink"></div>
      <div class="actions">
        <button class="ghost" id="copyBtn" type="button">Copy link</button>
        <a class="ghost" id="openBtn" href="#" target="_blank" rel="noopener">Open</a>
      </div>
    </section>
    <footer>One AliExpress product URL at a time.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
